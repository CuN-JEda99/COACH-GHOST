<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>COACH GHOST | Redirigiendo...</title>
    <script>
      // Redirecciona rutas no encontradas como /admin al hash #admin en la aplicación principal
      var path = window.location.pathname;
      var hash = window.location.hash;
      if (path.indexOf('/admin') !== -1 || hash === '#admin') {
        window.location.replace('./#admin');
      } else {
        window.location.replace('./');
      }
    </script>
  </head>
  <body style="background:#000000; color:#00FF88; font-family:sans-serif; text-align:center; padding-top:20vh;">
    <h2>Cargando COACH GHOST...</h2>
    <p><a href="./" style="color:#ffffff;">Haz clic aquí si no eres redirigido automáticamente</a></p>
  </body>
</html>
