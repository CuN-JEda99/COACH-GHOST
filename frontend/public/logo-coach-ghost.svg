<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="100%">
  <defs>
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="ghostGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF88" />
      <stop offset="100%" stop-color="#00B359" />
    </linearGradient>
  </defs>

  <!-- Ghost Mask Icon -->
  <g transform="translate(10, 10)">
    <!-- Aura Glow Background -->
    <path d="M50 8 C25 8 10 28 10 55 C10 80 18 98 25 98 C32 98 35 88 43 88 C50 88 53 98 60 98 C67 98 70 88 77 88 C85 88 88 98 95 98 C102 98 105 80 105 55 C105 28 85 8 50 8 Z" 
          fill="none" stroke="#00FF88" stroke-width="4" filter="url(#neon-glow)" opacity="0.9"/>
    
    <!-- Ghost Body Core -->
    <path d="M50 12 C28 12 15 30 15 55 C15 78 22 92 27 92 C33 92 37 84 44 84 C50 84 54 92 60 92 C66 92 70 84 76 84 C83 84 87 92 93 92 C98 92 100 78 100 55 C100 30 82 12 50 12 Z" 
          fill="#111113" stroke="#00FF88" stroke-width="2.5"/>

    <!-- Sharp Tech Eyes -->
    <polygon points="35,42 48,47 38,53" fill="#00FF88" filter="url(#neon-glow)"/>
    <polygon points="65,42 52,47 62,53" fill="#00FF88" filter="url(#neon-glow)"/>

    <!-- Football Hexagon Pattern on Forehead -->
    <polygon points="50,22 57,26 57,34 50,38 43,34 43,26" fill="none" stroke="#00FF88" stroke-width="1.5" opacity="0.75"/>
    <line x1="50" y1="22" x2="50" y2="14" stroke="#00FF88" stroke-width="1.5" opacity="0.6"/>
    <line x1="57" y1="34" x2="65" y2="38" stroke="#00FF88" stroke-width="1.5" opacity="0.6"/>
    <line x1="43" y1="34" x2="35" y2="38" stroke="#00FF88" stroke-width="1.5" opacity="0.6"/>
  </g>

  <!-- Typography: COACH GHOST -->
  <text x="125" y="58" font-family="'Sora', 'Inter', 'Arial Black', sans-serif" font-weight="900" font-size="38" fill="#FFFFFF" letter-spacing="2">
    COACH <tspan fill="#00FF88" filter="url(#neon-glow)">GHOST</tspan>
  </text>

  <!-- Tagline -->
  <text x="128" y="84" font-family="'Inter', system-ui, sans-serif" font-weight="700" font-size="12" fill="#A1A1AA" letter-spacing="4">
    AI ATHLETIC TRAINER <tspan fill="#00FF88">•</tspan> BOGOTÁ
  </text>
</svg>
